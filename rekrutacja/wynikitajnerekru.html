<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Zarządzania Rekrutacją</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Raleway', Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Zgłoszenia kandydatów</h1>
        
        <div id="loading" class="text-slate-500">Ładowanie zgłoszeń...</div>
        
        <div id="content" class="hidden grid grid-cols-1 gap-6">
            <!-- Applications will be injected here -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAR2Qw4o26EMIUmQbW8c1GRqFXT7JsMC7k",
            authDomain: "rekrutacjaoferty.firebaseapp.com",
            projectId: "rekrutacjaoferty",
            storageBucket: "rekrutacjaoferty.firebasestorage.app",
            messagingSenderId: "923562420686",
            appId: "1:923562420686:web:a7060b47a7cd8743e9239f"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchApplications() {
            const container = document.getElementById('content');
            const loading = document.getElementById('loading');
            
            try {
                const querySnapshot = await getDocs(collection(db, 'applications'));
                loading.classList.add('hidden');
                container.classList.remove('hidden');
                
                if (querySnapshot.empty) {
                    container.innerHTML = "<p class='text-slate-500'>Brak zgłoszeń w bazie.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = "bg-white p-6 rounded-lg shadow-sm border border-slate-200";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <h2 class="text-xl font-bold">${data.fullName}</h2>
                            <span class="text-xs bg-slate-100 px-2 py-1 rounded">${data.position || 'Nie określono'}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mt-4 text-sm">
                            <p><strong>Discord:</strong> ${data.discord}</p>
                            <p><strong>Roblox:</strong> ${data.roblox}</p>
                            <p><strong>Internet:</strong> ${data.internet}/10</p>
                            <p><strong>Czas:</strong> ${data.time}h/dzień</p>
                        </div>
                        <p class="mt-4 text-slate-600 italic">"${data.motivation}"</p>
                        <p class="mt-4 text-xs font-semibold text-blue-600">E-mail: ${data.email}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                loading.textContent = "Błąd podczas ładowania danych: " + err.message;
            }
        }

        fetchApplications();
    </script>
</body>
</html>
