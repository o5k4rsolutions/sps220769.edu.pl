<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Zarządzania</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
    <div id="loginForm" class="max-w-md mx-auto bg-white p-8 rounded shadow">
        <h2 class="text-xl font-bold mb-4">Logowanie do Panelu</h2>
        <input type="email" id="email" placeholder="E-mail" class="w-full p-2 border mb-2">
        <input type="password" id="pass" placeholder="Hasło" class="w-full p-2 border mb-4">
        <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded">Zaloguj</button>
    </div>

    <div id="content" class="hidden max-w-6xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Lista Zgłoszeń</h1>
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { /* ... wklej tutaj swój config ... */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.login = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
            } catch (err) { alert("Błędne dane!"); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                const querySnapshot = await getDocs(collection(db, 'applications'));
                const list = document.getElementById('list');
                querySnapshot.forEach((doc) => {
                    const d = doc.data();
                    list.innerHTML += `<div class="bg-white p-4 rounded shadow">${d.fullName} - ${d.position}<br><small>${d.email}</small></div>`;
                });
            }
        });
    </script>
</body>
</html>
